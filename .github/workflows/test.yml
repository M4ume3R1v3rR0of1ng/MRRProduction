# The cheap check that runs on everything.
#
# WHY THIS EXISTS SEPARATELY FROM ios-build.yml
#
# The iOS workflow filters itself down to paths that can affect an Xcode build,
# because macOS runners bill at ten times the Linux rate. That is right for it,
# but it left a hole: netlify/**, supabase/** and the root config were covered by
# no CI at all. A Netlify function could be broken and nothing would notice.
#
# Which is not theoretical. The commit that added error handling to
# stripe-webhook.js also put a .test.js file among the deployable functions and
# failed the production deploy, and no check caught it before Netlify did.
#
# So: no path filters here on purpose. This runs on every push. It is Linux, it
# is about a minute, and the whole point is that nothing slips past it.

name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push while the first is still running makes the first irrelevant.
# Cancel it rather than paying for an answer about code nobody has any more.
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests and builds
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      # ci, not install: fails loudly if package-lock.json and package.json have
      # drifted, rather than quietly resolving something different from local.
      - name: Install dependencies
        run: npm ci

      # Both ran only when someone remembered to, and 50 files had drifted out
      # of Prettier's style before this step existed. Lint fails on errors only;
      # its warnings (mostly hook dependency arrays) are reported, not gating.
      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # tsconfig.money-permissions.json type-checks a hand-picked list of files —
      # everywhere a wrong type moves money or an access decision — rather than
      # the whole app, since project-wide checkJs would light up hundreds of
      # pre-existing errors in unrelated JSX views. That list only stays honest
      # if something catches a new money-moving file that never got added to it,
      # which is exactly what happened to delete-company.js before this existed.
      - name: Money/permissions file coverage
        run: npm run check:money-coverage

      - name: Money/permissions type check
        run: npm run typecheck:money

      # Ratchet on inline styling: no .jsx file may add style={{}} blocks or raw
      # hex colors past scripts/style-baseline.json. New UI goes through the
      # shared primitives; see the header of scripts/check-style-drift.mjs.
      - name: Style drift
        run: npm run check:styles

      # Tests do not import every module, so they cannot catch a syntax error or a
      # bad import in a file nothing covers. The build does, and it is the same
      # command Netlify runs, so a green build here means a green deploy there.
      #
      # THE ENV VARS ARE DELIBERATE NONSENSE, AND MUST STAY THAT WAY
      #
      # The bundle itself needs nothing: Vite replaces import.meta.env with string
      # literals and never executes app code. The prerender-public-pages plugin
      # does — it evaluates the public pages as SSR modules in Node after the
      # bundle closes, and src/shared/utils/supabase.js throws at module load when
      # these two are absent. So from the commit that added prerendering
      # (2026-10-02) this step failed on every push, while Netlify stayed green
      # because its own env vars are set. The bundle built fine every time; it was
      # always the closeBundle hook that died, which is why the error arrives
      # AFTER "built in ...ms" and reads like a build failure.
      #
      # Real credentials would be pure cost. The only public page that queries
      # Supabase is TrainingPage, and it queries from inside a useEffect, which
      # renderToString never runs — so the prerendered HTML is byte-identical
      # either way, and carries neither value (verified: no supabase.co string in
      # dist/training.html). Wiring secrets in would buy nothing, make this cheap
      # hermetic check depend on a live project, and give it a way to fail that has
      # nothing to do with the code being tested.
      #
      # Same values and same reasoning as src/test/setup.js, which says it louder.
      # The URL has to parse, because createClient validates it; that is the only
      # requirement either one places on these strings.
      - name: Web build
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://test.supabase.co
          VITE_SUPABASE_ANON_KEY: test-anon-key

      # The App Store bundle takes a different path through the code: --mode ios
      # loads .env.ios, which folds IS_IOS_APP to true and drops the landing page,
      # the signup flow and BillingView. That tree-shaking can break on its own,
      # and nothing else here would notice.
      #
      # Deliberately `vite build` and not `npm run build:ios`. The latter also runs
      # `cap sync ios`, which is a Capacitor platform operation better left to the
      # macOS job that actually compiles the thing.
      #
      # And deliberately no env block, unlike the step above: prerender-public-pages
      # skips ios mode entirely (`env.mode !== "ios"` in vite.config.js), so nothing
      # evaluates supabase.js here and there is nothing to satisfy. Verified by
      # running this exact command with no .env and no vars set.
      - name: iOS bundle build
        run: npx vite build --mode ios

      # The mistake that broke production on 2026-08-20. Netlify treats every
      # top-level file in netlify/functions/ as a function to deploy and rejects
      # any name containing a dot, so a stray .test.js there fails the whole site
      # build with "Incorrect function names" and no mention of tests. Underscore
      # paths like _shared/ are skipped, which is where such tests belong.
      - name: No test files among deployable Netlify functions
        run: |
          found=$(ls netlify/functions/*.js 2>/dev/null | grep '\.test\.' || true)
          if [ -n "$found" ]; then
            echo "These would be deployed as Netlify functions and will fail the build:"
            echo "$found"
            echo "Move them into netlify/functions/_shared/ , which Netlify skips."
            exit 1
          fi
          echo "None. Deploy-safe."
