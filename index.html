<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is REQUIRED by the apple-mobile-web-app-status-bar-style
       below. "black-translucent" makes iOS hand the web view the whole screen and
       draw the status bar on top of it; without viewport-fit=cover the
       env(safe-area-inset-*) values all report 0px, so there is no way to pad the
       app out from under the clock and the home indicator. The two settings only
       work as a pair. See the --safe-* tokens in src/tokens.css. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Title and description match what LandingPage sets via useDocumentMeta, so
       crawlers that don't run JS see the same thing as ones that do. -->
    <title>Steadwerk | Inventory &amp; Fleet Software for Roofing Contractors</title>
    <meta
      name="description"
      content="Warehouse &amp; fleet software for roofing and construction companies. Inventory, fleet, jobs, and scheduling in one place — $99/mo for 10 users."
    />
    <!-- Link previews (iMessage, LinkedIn, Slack, email). Scrapers read only this raw
       HTML and never run the app, so these have to be static. og-image.png is
       generated by scripts/render-og-image.mjs.
       No rel=canonical or og:url on purpose: this one file is served for every
       path, so a hardcoded "/" would tell Google /terms, /privacy and /training
       are duplicates of the home page. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Steadwerk" />
    <meta property="og:title" content="Steadwerk | Tools that work as hard as you do" />
    <meta
      property="og:description"
      content="Inventory, fleet, jobs, and maintenance software for roofing and construction crews. Set up in an afternoon. $99/mo for 10 users."
    />
    <meta property="og:image" content="https://steadwerk.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Steadwerk: Tools that work as hard as you do." />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- App icons (Steadwerk truss mark, not the old Maumee mascot) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/steadwerk-icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <!-- Installed-app appearance -->
    <meta name="theme-color" content="#23282D" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Steadwerk" />
  </head>

  <body>
    <div id="root"></div>
    <!-- Real text for crawlers that don't execute JavaScript (Bing and most AI
       crawlers, link unfurlers). Browsers with JS never render it. Keep it in step
       with the hero and feature copy in src/public/LandingPage.jsx. -->
    <noscript>
      <main style="max-width: 720px; margin: 0 auto; padding: 32px 16px; font-family: sans-serif">
        <h1>Steadwerk: tools that work as hard as you do</h1>
        <p>
          Warehouse and fleet software for roofing and construction companies, built in Fort Wayne,
          Indiana. Set up in an afternoon. Home by supper.
        </p>
        <h2>Inventory</h2>
        <p>FIFO batches and live low-stock signals across every warehouse.</p>
        <h2>Jobs</h2>
        <p>
          Build the job, pull materials to it, complete it, and the close-out report writes itself.
        </p>
        <h2>Fleet</h2>
        <p>Trucks, trailers, mileage, oil, and services, tracked rather than guessed at.</p>
        <h2>Maintenance</h2>
        <p>Crews flag a problem from the cab; managers see it before it becomes a breakdown.</p>
        <h2>Reports</h2>
        <p>Job costing from the batches actually used, never a price typed in twice.</p>
        <h2>Pricing</h2>
        <p>$99 a month for up to 10 people, or $990 a year. Free trial, cancel any time.</p>
        <p>
          <a href="/login">Sign in</a> · <a href="/training">Training</a> ·
          <a href="/terms">Terms</a> · <a href="/privacy">Privacy</a> ·
          <a href="mailto:help@steadwerk.com">help@steadwerk.com</a>
        </p>
        <p>Steadwerk needs JavaScript enabled to run.</p>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
